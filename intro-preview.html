<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vasudev — opening motion study</title><link rel="stylesheet" href="motion-intro.css"><style>body{margin:0;background:#f5f3e9;color:#213c32;font-family:IntroMono,monospace}#journey-intro{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0}nav{position:fixed;bottom:20px;left:20px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;max-width:75vw}nav button{border:1px solid #607b4c;background:#f5f3e9;color:#213c32;border-radius:4px;padding:7px;font:11px IntroMono,monospace;cursor:pointer}.intro-skip{display:none}#journey-intro::backdrop{background:transparent}</style></head><body>
<dialog open id="journey-intro" class="journey-intro motion-intro" aria-label="Opening animation study"><canvas aria-label="A beginning without an end"></canvas><button class="intro-skip" type="button">Skip</button><nav aria-label="Inspect motion beats"><button type="button" data-t="0">0.0s</button><button type="button" data-t="1">1.0s</button><button type="button" data-t="1.5">1.5s</button><button type="button" data-t="2.5">2.5s</button><button type="button" data-t="3.5">3.5s</button><button type="button" data-t="4">4.0s</button><button type="button" data-t="5">5.0s</button><button type="button" data-t="5.5">5.5s</button><button type="button" id="play">Play 6s</button></nav></dialog>
<script src="intro-glyphs.js"></script><script src="intro-motion.js"></script><script>Promise.all([document.fonts.load('800 126px IntroSyne'),document.fonts.load('500 15px IntroMono')]).then(()=>{IntroMotion.render(.5);document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{IntroMotion.stop();IntroMotion.render(Number(b.dataset.t));});document.querySelector('#play').onclick=()=>IntroMotion.play();});</script></body></html>
